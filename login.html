<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - Smart Medicine System</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            font-family: Arial, sans-serif;

            background: #f1f5f9;
        }

        .login-container {
            width: 390px;

            background: white;

            padding: 40px;

            border-radius: 16px;

            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.12);
        }

        .logo {
            display: block;

            width: 70px;
            height: 70px;

            object-fit: contain;

            margin: 0 auto 15px;
        }

        h1 {
            margin: 0;

            text-align: center;

            color: #123f6d;

            font-size: 28px;
        }

        .subtitle {
            text-align: center;

            color: #64748b;

            margin-top: 8px;

            margin-bottom: 30px;
        }

        label {
            display: block;

            margin-bottom: 7px;

            font-weight: 600;

            color: #334155;
        }

        input {
            width: 100%;

            padding: 13px;

            margin-bottom: 18px;

            border: 1px solid #cbd5e1;

            border-radius: 8px;

            font-size: 15px;
        }

        input:focus {
            outline: none;

            border-color: #1d5d96;
        }

        button {
            width: 100%;

            padding: 13px;

            border: none;

            border-radius: 8px;

            background: #1d5d96;

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;
        }

        button:hover {
            background: #164a78;
        }

        button:disabled {
            background: #94a3b8;

            cursor: not-allowed;
        }

        #errorMessage {
            margin-top: 15px;

            text-align: center;

            color: #dc2626;

            font-size: 14px;
        }

        #successMessage {
            margin-top: 15px;

            text-align: center;

            color: #16a34a;

            font-size: 14px;
        }

    </style>

</head>


<body>


<div class="login-container">


    <img
        src="logo.png"
        alt="Smart Medicine"
        class="logo"
    >


    <h1>Smart Medicine</h1>

    <div class="subtitle">
        Caregiver Login
    </div>


    <form id="loginForm">


        <label for="email">
            Email Address
        </label>

        <input
            type="email"
            id="email"
            placeholder="Enter your email"
            required
        >


        <label for="password">
            Password
        </label>

        <input
            type="password"
            id="password"
            placeholder="Enter your password"
            required
        >


        <button
            type="submit"
            id="loginButton"
        >
            Login
        </button>


    </form>


    <div id="errorMessage"></div>

    <div id="successMessage"></div>


</div>


<script type="module">

    import { auth } from "./firebase-config.js";

    import {
        signInWithEmailAndPassword
    } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-auth.js";


    const loginForm =
        document.getElementById("loginForm");

    const loginButton =
        document.getElementById("loginButton");

    const errorMessage =
        document.getElementById("errorMessage");

    const successMessage =
        document.getElementById("successMessage");


    loginForm.addEventListener("submit", async function(event) {

        event.preventDefault();


        const email =
            document.getElementById("email").value.trim();

        const password =
            document.getElementById("password").value;


        errorMessage.textContent = "";

        successMessage.textContent = "";


        loginButton.disabled = true;

        loginButton.textContent = "Logging in...";


        try {

            await signInWithEmailAndPassword(
                auth,
                email,
                password
            );


            successMessage.textContent =
                "Login successful!";


            setTimeout(function() {

                window.location.href = "index.html";

            }, 500);


        } catch (error) {

            console.error("Login error:", error);


            if (
                error.code === "auth/invalid-credential"
            ) {

                errorMessage.textContent =
                    "Incorrect email or password.";

            }

            else if (
                error.code === "auth/invalid-email"
            ) {

                errorMessage.textContent =
                    "Please enter a valid email address.";

            }

            else {

                errorMessage.textContent =
                    "Login failed. Please try again.";

            }


            loginButton.disabled = false;

            loginButton.textContent = "Login";

        }

    });

</script>


</body>

</html>
