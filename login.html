<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - Smart Medicine System</title>


    <style>

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

            font-family: Arial, sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #e0f2fe,
                    #f1f5f9
                );

        }


        .login-container {

            width: 430px;

            max-width: 95%;

            background: white;

            padding: 35px;

            border-radius: 18px;

            box-shadow:
                0 15px 40px
                rgba(0, 0, 0, 0.12);

        }


        .logo {

            display: block;

            width: 70px;

            height: 70px;

            object-fit: contain;

            margin: 0 auto 12px;

        }


        h1 {

            margin: 0;

            text-align: center;

            color: #123f6d;

            font-size: 28px;

        }


        .subtitle {

            text-align: center;

            color: #64748b;

            margin-top: 8px;

            margin-bottom: 25px;

        }


        .section-title {

            font-size: 15px;

            font-weight: bold;

            color: #123f6d;

            margin-top: 20px;

            margin-bottom: 12px;

            padding-bottom: 6px;

            border-bottom:
                1px solid #e2e8f0;

        }


        label {

            display: block;

            margin-bottom: 6px;

            font-weight: 600;

            color: #334155;

        }


        input {

            width: 100%;

            padding: 12px;

            margin-bottom: 14px;

            border:
                1px solid #cbd5e1;

            border-radius: 8px;

            font-size: 15px;

        }


        input:focus {

            outline: none;

            border-color: #1d5d96;

            box-shadow:
                0 0 0 3px
                rgba(29, 93, 150, 0.10);

        }


        .row {

            display: grid;

            grid-template-columns:
                1fr 1fr;

            gap: 12px;

        }


        button {

            width: 100%;

            padding: 13px;

            border: none;

            border-radius: 8px;

            background: #1d5d96;

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

            margin-top: 8px;

        }


        button:hover {

            background: #164a78;

        }


        button:disabled {

            background: #94a3b8;

            cursor: not-allowed;

        }


        #errorMessage {

            margin-top: 15px;

            text-align: center;

            color: #dc2626;

            font-size: 14px;

        }


        #successMessage {

            margin-top: 15px;

            text-align: center;

            color: #16a34a;

            font-size: 14px;

        }


        .info {

            margin-top: 18px;

            padding: 10px;

            background: #f8fafc;

            border-radius: 8px;

            font-size: 12px;

            color: #64748b;

            text-align: center;

        }


        @media (max-width: 500px) {

            .login-container {

                padding: 25px;

            }

            .row {

                grid-template-columns: 1fr;

                gap: 0;

            }

        }

    </style>

</head>


<body>


<div class="login-container">


    <!-- LOGO -->

    <img
        src="logo.png"
        alt="Smart Medicine"
        class="logo"
    >


    <h1>
        Smart Medicine
    </h1>


    <div class="subtitle">
        Caregiver Login
    </div>



    <!-- LOGIN FORM -->

    <form id="loginForm">


        <!-- ACCOUNT -->

        <div class="section-title">
            🔐 Account Information
        </div>


        <label for="email">
            Email Address
        </label>


        <input
            type="email"
            id="email"
            placeholder="Enter your email"
            required
        >


        <label for="password">
            Password
        </label>


        <input
            type="password"
            id="password"
            placeholder="Enter your password"
            required
        >



        <!-- CAREGIVER -->

        <div class="section-title">
            👨‍⚕️ Caregiver Information
        </div>


        <label for="caregiverName">
            Caregiver Name
        </label>


        <input
            type="text"
            id="caregiverName"
            placeholder="Enter caregiver name"
            required
        >


        <label for="caregiverID">
            Caregiver ID
        </label>


        <input
            type="text"
            id="caregiverID"
            placeholder="Example: C001"
            required
        >



        <!-- PATIENT -->

        <div class="section-title">
            👤 Patient Information
        </div>


        <label for="patientId">
            Patient ID
        </label>


        <input
            type="text"
            id="patientId"
            placeholder="Example: P001"
            required
        >


        <label for="patientName">
            Patient Name
        </label>


        <input
            type="text"
            id="patientName"
            placeholder="Enter patient name"
            required
        >


        <label for="patientAge">
            Patient Age
        </label>


        <input
            type="number"
            id="patientAge"
            placeholder="Enter patient age"
            min="0"
            max="150"
            required
        >



        <!-- LOGIN BUTTON -->

        <button
            type="submit"
            id="loginButton"
        >
            Login
        </button>


    </form>



    <div id="errorMessage"></div>

    <div id="successMessage"></div>


    <div class="info">

        Your caregiver and patient information
        will be connected to this login account.

    </div>


</div>



<!-- =========================================================
     FIREBASE
========================================================= -->

<script type="module">


    import {
        auth,
        db
    } from "./firebase-config.js";


    import {
        signInWithEmailAndPassword
    } from
    "https://www.gstatic.com/firebasejs/12.13.0/firebase-auth.js";


    import {
        doc,
        setDoc
    } from
    "https://www.gstatic.com/firebasejs/12.13.0/firebase-firestore.js";



    // ========================================================
    // ELEMENTS
    // ========================================================


    const loginForm =
        document.getElementById(
            "loginForm"
        );


    const loginButton =
        document.getElementById(
            "loginButton"
        );


    const errorMessage =
        document.getElementById(
            "errorMessage"
        );


    const successMessage =
        document.getElementById(
            "successMessage"
        );



    // ========================================================
    // LOGIN
    // ========================================================


    loginForm.addEventListener(
        "submit",
        async function(event) {


            event.preventDefault();



            // ------------------------------------------------
            // GET FORM DATA
            // ------------------------------------------------


            const email =
                document
                    .getElementById("email")
                    .value
                    .trim();


            const password =
                document
                    .getElementById("password")
                    .value;


            const caregiverName =
                document
                    .getElementById("caregiverName")
                    .value
                    .trim();


            const caregiverID =
                document
                    .getElementById("caregiverID")
                    .value
                    .trim();


            const patientId =
                document
                    .getElementById("patientId")
                    .value
                    .trim();


            const patientName =
                document
                    .getElementById("patientName")
                    .value
                    .trim();


            const patientAge =
                Number(
                    document
                        .getElementById("patientAge")
                        .value
                );



            // ------------------------------------------------
            // CLEAR MESSAGES
            // ------------------------------------------------


            errorMessage.textContent = "";

            successMessage.textContent = "";



            // ------------------------------------------------
            // DISABLE BUTTON
            // ------------------------------------------------


            loginButton.disabled = true;

            loginButton.textContent =
                "Logging in...";



            try {


                // ==================================================
                // STEP 1
                // LOGIN TO FIREBASE AUTHENTICATION
                // ==================================================


                const userCredential =
                    await signInWithEmailAndPassword(
                        auth,
                        email,
                        password
                    );


                const user =
                    userCredential.user;



                console.log(
                    "LOGIN SUCCESSFUL"
                );


                console.log(
                    "Firebase UID:",
                    user.uid
                );



                // ==================================================
                // STEP 2
                // SAVE CAREGIVER DATA
                // ==================================================


                await setDoc(

                    doc(
                        db,
                        "Caregivers",
                        user.uid
                    ),

                    {

                        name:
                            caregiverName,

                        caregiverID:
                            caregiverID,

                        patientId:
                            patientId,

                        email:
                            user.email,

                        uid:
                            user.uid

                    },

                    {
                        merge: true
                    }

                );



                console.log(
                    "Caregiver data saved."
                );



                // ==================================================
                // STEP 3
                // SAVE PATIENT DATA
                // ==================================================

                /*
                    We use patientId as the
                    Firestore document ID.

                    Example:

                    Patients
                       └── P001
                */


                await setDoc(

                    doc(
                        db,
                        "Patients",
                        patientId
                    ),

                    {

                        patientId:
                            patientId,

                        caregiverID:
                            caregiverID,

                        caregiverUID:
                            user.uid,

                        name:
                            patientName,

                        age:
                            patientAge

                    },

                    {
                        merge: true
                    }

                );



                console.log(
                    "Patient data saved."
                );



                // ==================================================
                // SUCCESS
                // ==================================================


                successMessage.textContent =
                    "Login successful!";


                loginButton.textContent =
                    "Success ✓";



                // ==================================================
                // GO TO DASHBOARD
                // ==================================================


                setTimeout(
                    function() {

                        window.location.href =
                            "index.html";

                    },
                    700
                );


            }


            catch (error) {


                console.error(
                    "Login error:",
                    error
                );



                // ----------------------------------------------
                // FIREBASE ERRORS
                // ----------------------------------------------


                if (
                    error.code ===
                    "auth/invalid-credential"
                ) {

                    errorMessage.textContent =
                        "Incorrect email or password.";

                }


                else if (
                    error.code ===
                    "auth/invalid-email"
                ) {

                    errorMessage.textContent =
                        "Please enter a valid email address.";

                }


                else if (
                    error.code ===
                    "auth/user-not-found"
                ) {

                    errorMessage.textContent =
                        "User account was not found.";

                }


                else if (
                    error.code ===
                    "auth/wrong-password"
                ) {

                    errorMessage.textContent =
                        "Incorrect password.";

                }


                else if (
                    error.code ===
                    "permission-denied"
                ) {

                    errorMessage.textContent =
                        "Firestore permission denied. Check your Firestore rules.";

                }


                else {

                    errorMessage.textContent =
                        "Login failed: " +
                        error.message;

                }



                loginButton.disabled = false;

                loginButton.textContent =
                    "Login";

            }

        }

    );

</script>


</body>

</html>
